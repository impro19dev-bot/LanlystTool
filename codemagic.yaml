workflows:
  testFlight:
    name: "Ios Release"
    integrations:
      app_store_connect: Aymane Korai

    environment:
      flutter: 3.41.0
      # Xcode 26+ required for App Store (iOS 26 SDK / ITMS-90725)
      xcode: latest
      ios_signing:
        distribution_type: app_store
        # Must be an App Store profile for com.lanlystool.wpsapp (upload in Codemagic → Code signing)
        provisioning_profiles:
          - provisioning_LanlystTool
        certificates:
          - Certificate_aymane

    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build IPA
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - impro19dev@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration